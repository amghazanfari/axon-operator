{{- if and .Values.metrics.enabled .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axon-operator.fullname" . }}-allow-metrics-traffic
  namespace: {{ include "axon-operator.namespace" . }}
  labels:
    {{- include "axon-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "axon-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled
      ports:
        - port: {{ .Values.metrics.service.port }}
          protocol: TCP
{{- end -}}
