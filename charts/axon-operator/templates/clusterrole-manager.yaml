# ClusterRole for the controller manager (manager-role).
# This is the RBAC generated by controller-gen. It grants permissions on the
# resources the operator reconciles. Update the rules below as new controllers
# and watches are added.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "axon-operator.fullname" . }}-manager-role
  labels:
    {{- include "axon-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "secrets", "services"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["axonhub.looplj.com"]
  resources: ["axonhubs"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["axonhub.looplj.com"]
  resources: ["axonhubs/finalizers"]
  verbs: ["update"]
- apiGroups: ["axonhub.looplj.com"]
  resources: ["axonhubs/status"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "axon-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "axon-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "axon-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "axon-operator.serviceAccountName" . }}
  namespace: {{ include "axon-operator.namespace" . }}
